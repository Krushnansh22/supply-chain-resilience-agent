# ==============================================================================
# docker-compose.yml
# Supply Chain Resilience Agent — Multi-Service Container Orchestration
#
# Services:
#   mongodb   → MongoDB 7.0 Document Database                     (port 27017)
#   backend   → FastAPI + Agent Tools + Simulation Engine         (port 8000)
#   n8n       → n8n Workflow Automation Engine                     (port 5678)
#   frontend  → React Control Tower UI (Served via Nginx)          (port 5173 -> 80)
#
# Network:
#   internal_network (bridge) — Shared by backend, mongodb, n8n, frontend
#
# Run:
#   docker compose up --build
#
# Endpoints:
#   Frontend Web App:        http://localhost:5173
#   Backend API (Swagger):   http://localhost:8000/docs
#   n8n Workflow UI:         http://localhost:5678
#   MongoDB Database:        localhost:27017
# ==============================================================================

services:

  # ── MongoDB (Local Database Service) ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: scda-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=supplychaindb
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scda-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # If MONGO_URI is not set in backend/.env, default to containerized mongodb service
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-supplychaindb}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── n8n Workflow Engine ──────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: scda-n8n
    ports:
      - "5678:5678"
    env_file:
      - ./backend/.env
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      - N8N_USER_FOLDER=${N8N_USER_FOLDER:-/home/node/.n8n}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - BACKEND_API_KEY=${BACKEND_API_KEY}
      - AUTONOMOUS_APPROVAL_LIMIT_USD=${AUTONOMOUS_APPROVAL_LIMIT_USD:-50000}
      - NOTIFY_FROM_EMAIL=${NOTIFY_FROM_EMAIL}
      - APPROVAL_NOTIFY_EMAIL=${APPROVAL_NOTIFY_EMAIL}
      - OPS_ALERT_EMAIL=${OPS_ALERT_EMAIL}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.1}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped

  # ── Frontend (React + Nginx SPA) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: scda-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped


# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  # Persistent storage for MongoDB database documents
  mongodb_data:
    driver: local
  # Persistent storage for n8n workflow configurations & execution logs
  n8n_data:
    driver: local


# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  # Shared bridge network for container-to-container internal routing
  internal_network:
    driver: bridge
