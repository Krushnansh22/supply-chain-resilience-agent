# ==============================================================
# docker-compose.yml
# Owner: Developer 2 (Backend / Simulation) + Developer 4 (Frontend) coordinate this file
#
# Brings up:
#   - backend  -> FastAPI + SQLite simulated ERP + Agent + Decision Engine  (port 8000)
#   - frontend -> React Control Tower UI                                    (port 5173)
#
# Run:
#   docker compose up --build
#
# Backend will be reachable at:      http://localhost:8000
# Frontend will be reachable at:     http://localhost:5173
# API docs (Swagger, auto by FastAPI): http://localhost:8000/docs
# ==============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scda-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount source for hot-reload during hackathon dev; remove for a "frozen" demo build.
      - ./backend/app:/app/app
      - scda-data:/app/data   # persisted SQLite file lives here
    environment:
      - DATABASE_URL=sqlite:////app/data/scda.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scda-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  scda-data:
